version: '3.8'

services:
  sensor:
    build: .
    command: uvicorn sensor:app --host 0.0.0.0 --port 8000
    restart: always
    # Coolify uses Traefik labels to route your domains automatically

  dashboard:
    build: .
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    restart: always
